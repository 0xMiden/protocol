name: Set up Rust compiler cache
description: Use the shared kache R2 bucket when available and the runner's Cargo cache otherwise

inputs:
  warp:
    description: Use WarpBuild's Cargo cache for the fallback on Warp runners
    default: "false"

runs:
  using: composite
  steps:
    - name: Select R2 cache
      id: r2
      if: >-
        env.KACHE_R2_ENDPOINT != '' && env.KACHE_S3_ACCESS_KEY != '' && env.KACHE_S3_SECRET_KEY != '' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      shell: bash
      run: |
        if [[ ! "${KACHE_R2_ENDPOINT}" =~ ^https://[[:alnum:].-]+\.r2\.cloudflarestorage\.com/?$ ]]; then
          echo "::error::KACHE_R2_ENDPOINT must be the account's R2 S3 API URL."
          exit 1
        fi
        # kache reads protected artifacts first and publishes PR entries only under this prefix.
        echo "KACHE_PULL_REQUEST_PREFIX=artifacts-pr" >> "${GITHUB_ENV}"

    - name: Set up kache
      if: steps.r2.outcome == 'success'
      # Match the action commit in 0xMiden/node's actions.lock.
      uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed
      with:
        version: v2.3.0
        s3-bucket: kache
        s3-region: auto
        s3-endpoint: ${{ env.KACHE_R2_ENDPOINT }}
        s3-access-key-id: ${{ env.KACHE_S3_ACCESS_KEY }}
        s3-secret-access-key: ${{ env.KACHE_S3_SECRET_KEY }}
        manifest-key: protocol-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
        cache-executables: true
        github-cache: false
        pr-comment: false
        save-cache: >-
          ${{ github.event_name == 'pull_request' ||
              (github.event_name == 'push' && github.ref_protected &&
              (github.ref == 'refs/heads/next' || github.ref == 'refs/heads/main')) }}

    - name: Select path-aware compiler wrapper
      if: steps.r2.outcome == 'success' && env.RUSTC_WRAPPER != ''
      shell: bash
      # GITHUB_ACTION_PATH is the runner-provided directory containing this action.
      run: echo "RUSTC_WRAPPER=${GITHUB_ACTION_PATH}/kache.sh" >> "${GITHUB_ENV}" # zizmor: ignore[github-env]

    - name: Set up GitHub Cargo cache
      if: steps.r2.outcome == 'skipped' && inputs.warp != 'true'
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}

    - name: Set up WarpBuild Cargo cache
      if: steps.r2.outcome == 'skipped' && inputs.warp == 'true'
      uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
      with:
        save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
