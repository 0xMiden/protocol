name: Restore MASP packages
description: Restore the compiled packages for the workspace build scripts.
inputs:
  cache-key:
    description: Cache key from the prepare-masp job
    required: true
runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        key: ${{ inputs.cache-key }}
        path: .ci-masp
    # If the entry was evicted after preparation, leaving these variables unset lets
    # each crate's build script assemble its own packages as usual.
    - name: Use compiled packages
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      # The workspace prefix comes from the runner. The check below excludes newlines
      # and '=' from the only cache-controlled part of both the name and the value.
      run: | # zizmor: ignore[github-env]
        shopt -s failglob
        for dir in "$GITHUB_WORKSPACE"/.ci-masp/*; do
          crate=${dir##*/}
          [[ $crate =~ ^[a-zA-Z0-9_-]+$ && -d "$dir/assets" ]] || exit 1
          crate=$(printf '%s' "$crate" | tr '[:lower:]-' '[:upper:]_')
          printf '%s_MASP_DIR=%s\n' "$crate" "$dir" >> "$GITHUB_ENV"
        done
