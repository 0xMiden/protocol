name: GitHub Actions Security Analysis with zizmor

on:
  push:
    branches: [main, next]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "zizmor.yml"
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "zizmor.yml"
  merge_group:
  workflow_dispatch:

permissions: {}

# Node actions must use the updated system CA bundle.
env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

jobs:
  zizmor:
    name: Run zizmor
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Update CA certificates
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ca-certificates
          ubuntu_version="$(awk -F= '$1 == "VERSION_ID" {gsub(/"/, "", $2); print $2}' /etc/os-release)"
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" \
            ge "20260816ubuntu0.${ubuntu_version}.1"
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@71321a20a9ded102f6e9ce5718a2fcec2c4f70d8 # v0.5.2
        with:
          advanced-security: false
          config: zizmor.yml
          version: 1.23.1
