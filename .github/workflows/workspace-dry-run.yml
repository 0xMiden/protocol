name: Workspace release dry-run

on:
  push:
    branches:
      - main
      - next
      - 'release/**'

permissions:
  contents: read
  id-token: write  # Required for OIDC token exchange

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: true

# Until the runner's own Node is 24.22.1 or later, Node actions must use the system CA bundle,
# which distrusts the compromised eMudhra CAs (https://emudhra.we-have-a-problem.com/).
# This job saves the cargo cache that the publish job restores.
env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

jobs:
  release-dry-run:
    if: ${{ github.repository_owner == '0xMiden' }}
    runs-on: ubuntu-latest

    steps:
      # Fail on an image without the fixed bundle, e.g. after a rollback. Remove with NODE_OPTIONS.
      - name: Check CA certificates
        run: |
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" \
            ge 20260816ubuntu0.24.04.1

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Dry-run workspace release
        uses: ./.github/actions/workspace-release
        with:
          verify-branch-head: "false"
          # Honour the same escape hatch as the publish workflow so an intended root change does
          # not fail every push to the release branch.
          skip-masm-root-check-for-version: ${{ vars.SKIP_MASM_ROOT_CHECK_FOR_VERSION }}
          # ref left blank: uses the pushed ref
