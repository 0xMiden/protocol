name: Workspace release dry-run

on:
  push:
    branches:
      - main
      - next
      - 'release/**'

permissions:
  contents: read
  id-token: write  # Required for OIDC token exchange

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: true

# Node actions must use the updated system CA bundle.
env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

jobs:
  release-dry-run:
    if: ${{ github.repository_owner == '0xMiden' }}
    runs-on: ubuntu-latest

    steps:
      - name: Update CA certificates
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ca-certificates
          ubuntu_version="$(awk -F= '$1 == "VERSION_ID" {gsub(/"/, "", $2); print $2}' /etc/os-release)"
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" \
            ge "20260816ubuntu0.${ubuntu_version}.1"
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Dry-run workspace release
        uses: ./.github/actions/workspace-release
        with:
          verify-branch-head: "false"
          # Honour the same escape hatch as the publish workflow so an intended root change does
          # not fail every push to the release branch.
          skip-masm-root-check-for-version: ${{ vars.SKIP_MASM_ROOT_CHECK_FOR_VERSION }}
          # ref left blank: uses the pushed ref
