name: Trigger Aggregator Docs Rebuild

on:
  push:
    branches: [next]

# Node actions must use the updated system CA bundle.
env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

jobs:
  notify:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # Remove once the runner image ships the eMudhra distrust
      # (https://emudhra.we-have-a-problem.com/).
      - name: Update CA certificates
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ca-certificates
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" \
            ge 20260816ubuntu0.24.04.1

      - name: Send repository_dispatch to aggregator
        uses: peter-evans/repository-dispatch@a628c95fd17070f003ea24579a56e6bc89b25766
        with:
          # PAT that can access the central aggregator repository
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          repository: ${{ vars.DOCS_AGGREGATOR_REPO }}
          event-type: rebuild
