# Runs test related jobs.

name: test

# Limits workflow concurrency to only the latest commit in the PR.
concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

on:
  push:
    branches: [main, next]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:

permissions:
  contents: read

jobs:
  prepare-masp:
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name != github.repository ||
        github.event.pull_request.head.ref != 'next' ||
        github.event.pull_request.base.ref != 'main'
      }}
    uses: ./.github/workflows/prepare-masp.yml

  test:
    needs: prepare-masp
    name: Test shard ${{ matrix.shard }}/2
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: warp-ubuntu-latest-x64-8x
    env:
      CARGO_PROFILE_TEST_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # Keep this on a released install-action commit with an explicit tool; shortcut tags can
      # trip zizmor's impostor-commit audit when they are later retagged.
      - name: Install nextest
        uses: taiki-e/install-action@055f5df8c3f65ea01cd41e9dc855becd88953486 # v2.75.18
        with:
          tool: cargo-nextest
      - uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          # Both shards use the same dependencies. Only one needs to save the cache.
          save-if: >-
            ${{ matrix.shard == 1 && ((github.event_name == 'push' && github.ref == 'refs/heads/next') ||
                github.event.pull_request.number == 4293) }}
      - name: Install rust
        run: rustup update --no-self-update
      - uses: ./.github/actions/restore-masp
        with:
          cache-key: ${{ needs.prepare-masp.outputs.cache-key }}
      - name: Build tests
        run: make test-release-build
      - name: Run tests
        env:
          SHARD: ${{ matrix.shard }}
        run: make test-release name="--partition hash:$SHARD/2"
      - name: Test protobuf build support
        if: matrix.shard == 1
        run: cargo test -p miden-protobuf --all-features --locked

  test-result:
    # Branch protection requires a single check named "test" for the entire suite.
    name: test
    needs: [prepare-masp, test]
    if: ${{ !cancelled() && needs.prepare-masp.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check shard results
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success

  doc-tests:
    needs: prepare-masp
    name: doc-tests
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
      - name: Install rust
        run: rustup update --no-self-update
      - uses: ./.github/actions/restore-masp
        with:
          cache-key: ${{ needs.prepare-masp.outputs.cache-key }}
      - name: Run doc-tests
        run: make test-docs
