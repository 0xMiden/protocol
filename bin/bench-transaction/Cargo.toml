[package]
authors.workspace      = true
edition.workspace      = true
exclude.workspace      = true
homepage.workspace     = true
license.workspace      = true
name                   = "bench-transaction"
publish                = false
repository.workspace   = true
rust-version.workspace = true
version                = "0.1.0"

[lib]
doctest = false

[features]
concurrent = [
  "dep:anyhow",
  "dep:miden-agglayer",
  "dep:miden-processor",
  "dep:miden-protocol",
  "dep:miden-standards",
  "dep:miden-testing",
  "dep:miden-tx",
  "dep:rand",
  "dep:serde",
  "dep:serde_json",
  "dep:tokio",
  "miden-agglayer/testing",
  "miden-processor/concurrent",
  "miden-protocol/testing",
  "miden-tx/concurrent",
  "serde/derive",
  "serde/std",
  "serde_json/preserve_order",
  "serde_json/std",
  "tokio/macros",
  "tokio/rt",
]
default = ["concurrent"]

[[bench]]
harness = false
name    = "time_counting_benchmarks"
path    = "src/time_counting_benchmarks/prove.rs"

[dependencies]
# Workspace dependencies
miden-agglayer  = { optional = true, workspace = true }
miden-processor = { optional = true, workspace = true }
miden-protocol  = { optional = true, workspace = true }
miden-standards = { optional = true, workspace = true }
miden-testing   = { optional = true, workspace = true }
miden-tx        = { optional = true, workspace = true }

# External dependencies
anyhow     = { optional = true, workspace = true }
rand       = { optional = true, workspace = true }
serde      = { optional = true, workspace = true }
serde_json = { optional = true, workspace = true }
tokio      = { optional = true, workspace = true }

[dev-dependencies]
criterion = { features = ["async_tokio", "html_reports"], workspace = true }
