# cargo-deny configuration, see https://github.com/EmbarkStudios/cargo-deny

# Graph configuration
[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

# Advisory database configuration
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
  "RUSTSEC-2024-0436", # paste is unmaintained but no alternative available
  "RUSTSEC-2026-0194", # quick-xml has a vulnerability - ignore as we only depend on it for non-security-critical benchmarking functionality
  "RUSTSEC-2026-0195", # quick-xml has a vulnerability - ignore as we only depend on it for non-security-critical benchmarking functionality
]
yanked = "warn"

# License configuration
[licenses]
allow = [
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [
  # Each entry is the crate and version constraint, and its specific allowed licenses
  #{ allow = ["Zlib"], name = "adler32", version = "*" },
]

# Bans configuration
[bans]
allow = [
  #{ name = "ansi_term", version = "=0.11.0" },
]
deny = [
  #{ name = "ansi_term", version = "=0.11.0" },
]
highlight = "all"
multiple-versions = "deny"
skip = [
  #{ name = "ansi_term", version = "=0.11.0" },
  { name = "cpufeatures" },
  { name = "itertools" },
  { name = "num-bigint" },
  { name = "sha3" },
  # Miden VM 0.31 mixes Plonky3 0.6.3 with p3-security's 0.7.0 release candidates.
  # See https://github.com/0xMiden/miden-vm/issues/3773.
  { name = "p3-air", version = "=0.7.0-rc.1" },
  { name = "p3-field", version = "=0.7.0-rc.1" },
  { name = "p3-matrix", version = "=0.7.0-rc.1" },
  { name = "p3-maybe-rayon", version = "=0.7.0-rc.1" },
  { name = "p3-util", version = "=0.7.0-rc.1" },
  # Allow duplicate rand versions - miden-field uses 0.10, proptest uses 0.9.
  { name = "getrandom" },
  { name = "rand" },
  { name = "rand_chacha" },
  { name = "rand_core" },
  # prost-build's petgraph dependency uses the older hashbrown/foldhash stack.
  { name = "foldhash", version = "=0.1.5" },
  { name = "hashbrown", version = "=0.15.5" },
  # protox uses logos 0.15 in its parser and logos 0.16 in prost-reflect.
  { name = "logos", version = "=0.15.1" },
  { name = "logos-codegen", version = "=0.15.1" },
  { name = "logos-derive", version = "=0.15.1" },
]
skip-tree = [
  # Allow rustc_version v0.2.x - build dependency version
  { name = "rustc_version", version = "=0.2.*" },
  # Allow unicode-width v0.1.x - used by miden-formatting vs textwrap conflict
  { name = "unicode-width", version = "=0.1.*" },
  # Allow syn v1.x and v2.x - our derive macros need v1.x while ecosystem uses v2.x
  { name = "syn", version = "=1.0.109" },
  { name = "syn", version = "=2.0.119" },
  # Allow spin v0.9.x - legacy version used by some dependencies
  { name = "spin", version = "=0.9.*" },
]
wildcards = "allow"

# Sources configuration
[sources]
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
unknown-git      = "deny"
unknown-registry = "deny"
