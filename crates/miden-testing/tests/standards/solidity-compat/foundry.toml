[profile.default]
libs           = ["../../../../miden-agglayer/solidity-compat/lib"]
optimizer      = true
optimizer_runs = 200
out            = "out"
solc           = "0.8.28"
src            = "src"
via_ir         = true

remappings = [
  "@openzeppelin/contracts/=../../../../miden-agglayer/solidity-compat/lib/openzeppelin-contracts/contracts/",
  "forge-std/=../../../../miden-agglayer/solidity-compat/lib/forge-std/src/",
]

fs_permissions = [
  { access = "read-write", path = "../test-vectors" },
]
