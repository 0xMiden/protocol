[package]
authors.workspace      = true
description            = "USDCx components for the Miden protocol"
edition.workspace      = true
homepage.workspace     = true
license.workspace      = true
name                   = "miden-usdcx"
publish                = true
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[lib]
bench = false

# The test vector generator.
[[bin]]
name              = "gen_vectors"
required-features = ["vectors"]

[features]
default = ["std"]
std     = ["miden-protocol/std", "miden-standards/std", "miden-tx/std"]
# Exposes the whole `xreserve` MASM library.
testing = ["miden-protocol/testing"]
# Enables the canonical golden-vector generator binary.
vectors = ["dep:k256", "dep:miden-crypto", "dep:rand", "dep:sha3"]

[dependencies]
# Workspace dependencies
miden-protocol  = { workspace = true }
miden-standards = { workspace = true }
miden-tx        = { workspace = true }

# External dependencies
bon        = { workspace = true }
serde      = { features = ["alloc", "derive"], workspace = true }
serde_json = { features = ["alloc"], workspace = true }

# Optional vector-generator dependencies
k256         = { features = ["ecdsa"], optional = true, workspace = true }
miden-crypto = { features = ["std"], optional = true, workspace = true }
rand         = { optional = true, workspace = true }
sha3         = { optional = true, workspace = true }

[dev-dependencies]
# Depends on itself so the `testing` feature is on for the test build.
anyhow          = { workspace = true }
assert_matches  = { workspace = true }
k256            = { workspace = true }
miden-crypto    = { features = ["std"], workspace = true }
miden-processor = { workspace = true }
miden-standards = { features = ["testing"], workspace = true }
miden-testing   = { features = ["std"], workspace = true }
miden-usdcx     = { features = ["testing"], path = "." }
rand            = { workspace = true }
rstest          = { workspace = true }
sha3            = { workspace = true }
tokio           = { features = ["macros", "rt", "sync"], workspace = true }

[build-dependencies]
miden-assembly             = { features = ["std"], workspace = true }
miden-core-lib             = { workspace = true }
miden-package-registry     = { features = ["resolver", "std"], workspace = true }
miden-protocol             = { workspace = true }
miden-protocol-build-utils = { workspace = true }
miden-standards            = { workspace = true }
