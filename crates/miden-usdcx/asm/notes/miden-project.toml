[workspace]
members = ["set_attester"]

[workspace.package]
version = "0.17.2"

# The xreserve library is linked STATIC so each note package carries its own MAST and the note
# executes on any node, without the xreserve package having to be loaded into that node's MAST
# store. Flip this to `dynamic` once the library is integrated into `StandardsLib` and loaded
# into every executor automatically (by `TransactionMastStore::new`).
[workspace.dependencies]
miden-core      = { linkage = "dynamic", version = "0.36" }
miden-protocol  = { linkage = "dynamic", version = "0.17.2" }
miden-standards = { linkage = "dynamic", version = "0.17.2" }
xreserve        = { linkage = "static", version = "0.17.2" }
