[workspace]
members = [
  "kernels/batch",
  "kernels/block",
  "kernels/transaction",
  "kernels/transaction-core",
  "protocol",
  "protocol_utils",
]

[workspace.package]
version = "1.0.0-rc.1"

[workspace.dependencies]
miden-core           = { linkage = "dynamic", version = "0.36" }
miden-protocol-utils = { linkage = "static", path = "protocol_utils", version = "1.0.0-rc.1" }
miden-tx-kernel      = { linkage = "dynamic", path = "kernels/transaction", version = "1.0.0-rc.1" }
miden-tx-kernel-core = { linkage = "static", path = "kernels/transaction-core", version = "1.0.0-rc.1" }
