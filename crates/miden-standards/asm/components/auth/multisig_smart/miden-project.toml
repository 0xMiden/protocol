[package]
name              = "miden-standards-auth-multisig-smart"
version.workspace = true

[lib]
kind      = "account-component"
namespace = "miden::standards::components::auth::multisig_smart"
path      = "multisig_smart.masm"

[dependencies]
miden-core.workspace      = true
miden-protocol.workspace  = true
miden-standards.workspace = true

[package.metadata.account-component]
description = "Multisig authentication with per-procedure smart policies"
name        = "miden::standards::auth::multisig_smart"
version     = "1.0.0"

[[package.metadata.account-component.storage.slots]]
description = "Threshold configuration"
name = "miden::standards::auth::multisig::threshold_config"
type = [
  { name = "threshold", type = "u32" },
  { name = "num_approvers", type = "u32" },
  { type = "void" },
  { type = "void" },
]

[[package.metadata.account-component.storage.slots]]
description = "Approver public keys"
name        = "miden::standards::auth::multisig::approver_public_keys"
type        = { key = "u32", value = "miden::standards::auth::pub_key" }

[[package.metadata.account-component.storage.slots]]
description = "Approver scheme IDs"
name        = "miden::standards::auth::multisig::approver_schemes"
type        = { key = "u32", value = "miden::standards::auth::scheme" }

[[package.metadata.account-component.storage.slots]]
description = "Executed transactions"
name        = "miden::standards::auth::multisig::executed_transactions"
type        = { key = "word", value = "bool" }

[[package.metadata.account-component.storage.slots]]
description = "Procedure policies"
name        = "miden::standards::auth::multisig_smart::procedure_policies"
type        = { key = "word", value = "word" }

[[package.metadata.account-component.storage.slots]]
description = "Delayed execution policy"
name = "miden::standards::auth::multisig_smart::delay_config"
type = [
  { name = "min_delay", type = "u32" },
  { name = "propose_expiration_delta", type = "u16" },
  { name = "cancel_threshold", type = "u32" },
  { type = "void" },
]

[[package.metadata.account-component.storage.slots]]
description = "Tx proposals (tx_summary_commitment => [unlock_block, proposal_block, min_cancel_sigs, 0]); a cancelled proposal keeps its record with unlock_block = u32::MAX"
name        = "miden::standards::auth::multisig_smart::tx_proposals"
type        = { key = "word", value = "word" }

[[package.metadata.account-component.storage.slots]]
description = "Spending limits configuration"
name = "miden::standards::auth::multisig_smart::spending_config"
type = [
  { name = "window_blocks", type = "u32" },
  { name = "unpriced_asset_policy", type = "u8" },
  { type = "void" },
  { type = "void" },
]

[[package.metadata.account-component.storage.slots]]
description = "Spending limits price oracle"
name = "miden::standards::auth::multisig_smart::spending_oracle"
type = [
  { name = "oracle_id_suffix", type = "felt" },
  { name = "oracle_id_prefix", type = "felt" },
  { name = "max_oracle_block_age", type = "u16" },
  { type = "void" },
]

[[package.metadata.account-component.storage.slots]]
description = "Spending limits base asset"
name        = "miden::standards::auth::multisig_smart::spending_base_asset"
type        = "word"

[[package.metadata.account-component.storage.slots]]
description = "Spending limit"
name        = "miden::standards::auth::multisig_smart::spending_limit"
type        = [{ name = "limit", type = "felt" }, { type = "void" }, { type = "void" }, { type = "void" }]

[[package.metadata.account-component.storage.slots]]
description = "Spending limit tracker"
name = "miden::standards::auth::multisig_smart::spending_tracker"
type = [
  { name = "spent_in_window", type = "felt" },
  { name = "window_end_block", type = "felt" },
  { type = "void" },
  { type = "void" },
]
