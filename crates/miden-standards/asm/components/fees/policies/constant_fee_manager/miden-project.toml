[package]
name              = "miden-standards-fees-policies-constant-fee-manager"
version.workspace = true

[lib]
kind      = "account-component"
namespace = "miden::standards::components::fees::policies::constant_fee_manager"
path      = "constant_fee_manager.masm"

[dependencies]
miden-core.workspace      = true
miden-protocol.workspace  = true
miden-standards.workspace = true

[package.metadata.account-component]
description = "Authority-gated constant-fee schedule admin: exposes `set_note_fee` to update the fee schedule slot recorded in its storage, gated by the account-wide Authority component."
name        = "miden::standards::fees::policies::constant_fee_manager"
version     = "1.0.0"

[[package.metadata.account-component.storage.slots]]
description = "ID of the fee schedule slot this manager updates"
name        = "miden::standards::fees::policies::constant_fee_manager::fee_schedule_slot_id"
type        = "word"
