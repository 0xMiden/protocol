[package]
name              = "miden-standards-fees-policies-basic-constant-fee"
version.workspace = true

[lib]
kind      = "account-component"
namespace = "miden::standards::components::fees::policies::basic_constant_fee"
path      = "basic_constant_fee.masm"

[dependencies]
miden-core.workspace      = true
miden-protocol.workspace  = true
miden-standards.workspace = true

[package.metadata.account-component]
description = "`basic_constant_fee` fee policy charging a constant per-note-script fee"
name        = "miden::standards::fees::policies::basic_constant_fee"
version     = "1.0.0"

[[package.metadata.account-component.storage.slots]]
description = "Fee charged per note script root"
name        = "miden::standards::fees::policies::basic_constant_fee::fee_schedule"

[package.metadata.account-component.storage.slots.type]
key   = "word"
value = "word"
