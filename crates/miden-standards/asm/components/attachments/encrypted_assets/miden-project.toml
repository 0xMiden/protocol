[package]
name              = "miden-standards-attachments-encrypted-assets"
version.workspace = true

[lib]
kind      = "account-component"
namespace = "miden::standards::components::attachments::encrypted_assets"
path      = "encrypted_assets.masm"

[dependencies]
miden-core.workspace      = true
miden-protocol.workspace  = true
miden-standards.workspace = true

[package.metadata.account-component]
description = "Issuer key to which encrypted asset attachments are encrypted"
name        = "miden::standards::attachments::encrypted_assets"
version     = "1.0.0"

[[package.metadata.account-component.storage.slots]]
description = "The head of the issuer's EcGFp5 public key, its first four elements"
name        = "miden::standards::attachments::encrypted_assets::issuer_key_head"
type        = "word"

[[package.metadata.account-component.storage.slots]]
description = "The tail of the issuer's EcGFp5 public key, its fifth element followed by three zeros"
name        = "miden::standards::attachments::encrypted_assets::issuer_key_tail"
type        = "word"

[[package.metadata.account-component.storage.slots]]
description = "The commitment to the preprocessed multiplication tables of the issuer's EcGFp5 public key"
name        = "miden::standards::attachments::encrypted_assets::prepared_issuer_key"
type        = "word"
