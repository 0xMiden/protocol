[package]
name              = "miden-standards-inspection-schema-commitment"
version.workspace = true

[lib]
kind      = "account-component"
namespace = "miden::standards::components::inspection::schema_commitment"
path      = "schema_commitment.masm"

[dependencies]
miden-core.workspace      = true
miden-protocol.workspace  = true
miden-standards.workspace = true

[package.metadata.account-component]
description = "Component exposing the account storage schema commitment"
name        = "miden::standards::inspection::storage_schema"
version     = "1.0.0"

[[package.metadata.account-component.storage.slots]]
description = "Commitment to the storage schema of an account"
name        = "miden::standards::inspection::storage_schema::commitment"
type        = "word"
