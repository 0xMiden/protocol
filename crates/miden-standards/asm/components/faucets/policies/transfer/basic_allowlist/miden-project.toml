[package]
name              = "miden-standards-faucets-policies-transfer-basic-allowlist"
version.workspace = true

[lib]
kind      = "account-component"
namespace = "miden::standards::components::faucets::policies::transfer::basic_allowlist"
path      = "basic_allowlist.masm"

[dependencies]
miden-core.workspace      = true
miden-protocol.workspace  = true
miden-standards.workspace = true

[package.metadata.account-component]
description = "Transfer policy allowing transfers only to allowlisted accounts"
name        = "miden::standards::faucets::policies::transfer::basic_allowlist"
version     = "1.0.0"

[[package.metadata.account-component.storage.slots]]
description = "Whether an account is allowed to receive transfers"
name        = "miden::standards::faucets::policies::transfer::allowlist::allowed_accounts"
type        = { key = "word", value = "bool" }
