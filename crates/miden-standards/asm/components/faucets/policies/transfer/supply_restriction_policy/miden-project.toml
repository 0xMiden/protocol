[package]
name              = "miden-standards-faucets-policies-transfer-supply-restriction-policy"
version.workspace = true

[lib]
kind      = "account-component"
namespace = "miden::standards::components::faucets::policies::transfer::supply_restriction_policy"
path      = "supply_restriction_policy.masm"

[dependencies]
miden-core.workspace      = true
miden-protocol.workspace  = true
miden-standards.workspace = true

[package.metadata.account-component]
description = "Send policy rejecting transfers of frozen or confiscated amounts"
name        = "miden::standards::faucets::policies::transfer::supply_restriction_policy"
version     = "1.0.0"

[[package.metadata.account-component.storage.slots]]
description = "Frozen and confiscated amounts per account"
name = "miden::standards::faucets::policies::transfer::supply_restriction::restricted_amounts"
type = { key = "word", value = [
  { name = "frozen", type = "felt" },
  { name = "confiscated", type = "felt" },
  { type = "void" },
  { type = "void" },
] }
