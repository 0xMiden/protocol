[package]
name              = "miden-standards-faucets-supply-restriction"
version.workspace = true

[lib]
kind      = "account-component"
namespace = "miden::standards::components::faucets::supply_restriction"
path      = "supply_restriction.masm"

[dependencies]
miden-core.workspace      = true
miden-protocol.workspace  = true
miden-standards.workspace = true

[package.metadata.account-component]
description = "Authority-gated freezing and confiscation of fungible asset amounts held by accounts"
name        = "miden::standards::faucets::supply_restriction"
version     = "1.0.0"

[[package.metadata.account-component.storage.slots]]
description = "Frozen and confiscated amounts per account"
name = "miden::standards::faucets::supply_restriction::restrictions"
type = { key = "word", value = [
  { name = "frozen", type = "felt" },
  { name = "confiscated", type = "felt" },
  { type = "void" },
  { type = "void" },
] }
