syntax = "proto3";
package mock_chain_snapshot;

import "account.proto";
import "account_file.proto";
import "account_state.proto";
import "batch.proto";
import "block.proto";
import "block_number.proto";
import "note.proto";
import "primitives.proto";
import "protocol_config.proto";
import "transaction.proto";
import "transaction_inputs.proto";

// Local snapshot containing unencrypted secret keys.
message MockChainSnapshot {
  oneof version {
    MockChainSnapshotV1 v1 = 1;
  }
}

message MockChainSnapshotV1 {
  // Ordered history used to rebuild the chain MMR.
  repeated ProvenBlock blocks = 1;
  repeated AccountCommitment account_commitments = 2;
  repeated SpentNullifier spent_nullifiers = 3;
  repeated transaction.ProvenTransaction pending_transactions = 4;
  repeated transaction.ProvenBatch pending_batches = 5;
  repeated account.Account committed_accounts = 6;
  repeated MockChainNote committed_notes = 7;
  repeated AccountAuthenticator account_authenticators = 8;
  repeated account_file.AuthSecretKey validator_secret_keys = 9;
  protocol_config.ProtocolConfig protocol_config = 10;
}

message ProvenBlock {
  blockchain.BlockHeader header = 1;
  blockchain.BlockBody body = 2;
  repeated primitives.Signature signatures = 3;
  primitives.ExecutionProof proof = 4;
}

message AccountCommitment {
  account.AccountId account_id = 1;
  primitives.Word commitment = 2;
}

message SpentNullifier {
  primitives.Word nullifier = 1;
  blockchain.BlockNumber block_num = 2;
}

message MockChainNote {
  oneof details {
    // Includes private genesis notes.
    transaction.AuthenticatedInputNote full = 1;
    PrivateNote private = 2;
  }
}

message PrivateNote {
  note.NoteMetadata metadata = 1;
  note.NoteAttachments attachments = 2;
  note.NoteInclusionProof proof = 3;
}

message AccountAuthenticator {
  account.AccountId account_id = 1;
  // Absent and empty authenticators are distinct.
  optional Authenticator authenticator = 2;
}

message Authenticator {
  repeated account_file.AuthSecretKey keys = 1;
}
