syntax = "proto3";
package transaction;

import "account.proto";
import "block.proto";
import "note.proto";
import "partial_blockchain.proto";
import "primitives.proto";
import "protocol_config.proto";
import "transaction.proto";

message AuthenticatedInputNote {
  note.Note note = 1;
  note.NoteInclusionProof proof = 2;
}

message InputNote {
  oneof note {
    AuthenticatedInputNote authenticated = 1;
    note.Note unauthenticated = 2;
  }
}

message InputNotes {
  repeated InputNote notes = 1;
}

message AccountInputs {
  account.PartialAccount account = 1;
  account.AccountWitness witness = 2;
}

message AuthSignature {
  oneof signature {
    // Canonically serialized ECDSA secp256k1 signature.
    bytes ecdsa_k256_keccak = 1;
    // Canonically serialized Falcon512-Poseidon2 signature.
    bytes falcon512_poseidon2 = 2;
  }
}

message SignatureEntry {
  primitives.Word pub_key_commitment = 1;
  primitives.Word message = 2;
  AuthSignature signature = 3;
}

message TransactionInputs {
  oneof version {
    TransactionInputsV1 v1 = 1;
  }
}

message TransactionInputsV1 {
  account.PartialAccount account = 1;
  blockchain.BlockHeader block_header = 2;
  protocol_config.ProtocolConfig protocol_config = 3;
  blockchain.PartialBlockchain partial_blockchain = 4;
  InputNotes input_notes = 5;
  TransactionArgs tx_args = 6;
  repeated AccountInputs foreign_accounts = 7;
  repeated note.NoteScript note_scripts = 8;
  repeated SignatureEntry signatures = 9;
}
