syntax = "proto3";
package transaction;

import "account.proto";
import "block_number.proto";
import "note.proto";
import "primitives.proto";

message TransactionId {
  primitives.Word id = 1;
}

message InputNoteCommitment {
  primitives.Word nullifier = 1;
  optional note.NoteHeader header = 2;
}

message TransactionHeader {
  TransactionId transaction_id = 1;
  account.AccountId account_id = 2;
  primitives.Word initial_state_commitment = 3;
  primitives.Word final_state_commitment = 4;
  repeated InputNoteCommitment input_notes = 5;
  repeated note.NoteHeader output_notes = 6;
  primitives.Word logs_commitment = 7;
}

message PublicOutputNote {
  note.Note note = 1;
}

message PrivateOutputNote {
  note.NoteHeader header = 1;
  note.NoteAttachments attachments = 2;
}

message OutputNote {
  oneof note {
    PublicOutputNote public = 1;
    PrivateOutputNote private = 2;
  }
}

// A note created by an executed transaction, before proving erases the details of private notes.
message RawOutputNote {
  oneof note {
    note.Note full = 1;
    note.PartialNote partial = 2;
  }
}

message RawOutputNotes {
  repeated RawOutputNote notes = 1;
}

message TxAccountUpdate {
  account.AccountId account_id = 1;
  primitives.Word initial_state_commitment = 2;
  primitives.Word final_state_commitment = 3;
  primitives.Word account_patch_commitment = 4;
  account.AccountUpdateDetails details = 5;
}

message ProvenTransaction {
  TxAccountUpdate account_update = 1;
  repeated InputNoteCommitment input_notes = 2;
  repeated OutputNote output_notes = 3;
  blockchain.BlockNumber reference_block_num = 4;
  primitives.Word reference_block_commitment = 5;
  blockchain.BlockNumber expiration_block_num = 6;
  primitives.ExecutionProof proof = 7;
  // Complete public logs or only a private commitment.
  TransactionLogDetails log_details = 8;
}

message TransactionScript {
  uint32 entrypoint = 1;
  primitives.MastForest mast = 2;
}

message NoteArgument {
  note.NoteId note_id = 1;
  primitives.Word args = 2;
}

message AuthSignature {
  oneof signature {
    // Canonically serialized ECDSA secp256k1 signature.
    bytes ecdsa_k256_keccak = 1;
    // Canonically serialized Falcon512-Poseidon2 signature.
    bytes falcon512_poseidon2 = 2;
  }
}

message BoundSignature {
  primitives.Word pub_key_commitment = 1;
  primitives.Word message = 2;
  AuthSignature signature = 3;
}

message TransactionArgs {
  optional TransactionScript tx_script = 1;
  primitives.Word tx_script_args = 2;
  repeated NoteArgument note_args = 3;
  primitives.AdviceInputs advice_inputs = 4;
  primitives.Word auth_args = 5;
  optional account.AccountCodeUpgrade account_code_upgrade = 6;
  repeated note.NoteRecipient output_note_recipients = 7;
  repeated BoundSignature signatures = 8;
}

message LogTopic {
  primitives.Felt suffix = 1;
  primitives.Felt prefix = 2;
}

message TransactionLog {
  account.AccountId emitter = 1;
  LogTopic topic = 2;
  repeated primitives.Word content = 3;
}

message TransactionLogs {
  repeated TransactionLog logs = 1;
}

message TransactionLogDetails {
  oneof visibility {
    primitives.Word private = 1;
    TransactionLogs public = 2;
  }
}

// Detached public log delivery. These messages are not fields of batches or blocks.
message PublicTransactionLogEntry {
  TransactionId transaction_id = 1;
  TransactionLogs logs = 2;
}

message PublicTransactionLogBundle {
  // Binds all ordered transaction headers, including private transactions.
  primitives.Word transactions_commitment = 1;
  // One entry per public native account transaction, including empty log lists.
  repeated PublicTransactionLogEntry entries = 2;
}
