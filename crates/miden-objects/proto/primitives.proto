syntax = "proto3";
package primitives;

message Felt {
  // Exactly eight bytes containing a canonically serialized field element.
  bytes encoded = 1;
}

message Word {
  // Exactly 32 bytes containing four canonically serialized field elements.
  bytes encoded = 1;
}

message ExecutionProof {
  // Canonically serialized protocol execution proof.
  bytes encoded = 1;
}

message MastForest {
  // Canonically serialized MAST forest.
  bytes encoded = 1;
}

message PublicKey {
  bytes encoded = 1;
}

message Signature {
  bytes encoded = 1;
}

message Asset {
  Word key = 1;
  Word value = 2;
}

message MerklePath {
  repeated Word siblings = 1;
}

message SparseMerklePath {
  fixed64 empty_nodes_mask = 1;
  repeated Word siblings = 2;
}

message MmrDelta {
  uint64 forest = 1;
  repeated Word update_data = 2;
}

message SmtLeafEntry {
  Word key = 1;
  Word value = 2;
}

message SmtLeafEntryList {
  repeated SmtLeafEntry entries = 1;
}

message SmtLeaf {
  oneof leaf {
    uint64 empty_leaf_index = 1;
    SmtLeafEntry single = 2;
    SmtLeafEntryList multiple = 3;
  }
}

message SmtOpening {
  SparseMerklePath path = 1;
  SmtLeaf leaf = 2;
}
