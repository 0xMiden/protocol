syntax = "proto3";
package blockchain;

import "account.proto";
import "primitives.proto";
import "transaction.proto";

message FeeParameters {
  account.AccountId native_asset_id = 1;
  fixed32 verification_base_fee = 2;
}

message BlockHeader {
  uint32 version = 1;
  primitives.Digest prev_block_commitment = 2;
  fixed32 block_num = 3;
  primitives.Digest chain_commitment = 4;
  primitives.Digest account_root = 5;
  primitives.Digest nullifier_root = 6;
  primitives.Digest note_root = 7;
  primitives.Digest tx_commitment = 8;
  repeated primitives.PublicKey validator_keys = 9;
  primitives.Digest tx_kernel_commitment = 10;
  FeeParameters fee_parameters = 11;
  fixed32 timestamp = 12;
}

message BlockNumber {
  fixed32 block_num = 1;
}

message BlockSignature {
  bytes signature = 1;
}

message BlockAccountUpdate {
  account.AccountId account_id = 1;
  primitives.Word final_state_commitment = 2;
  account.AccountUpdateDetails details = 3;
}

message IndexedOutputNote {
  uint32 note_index_in_batch = 1;
  transaction.OutputNote note = 2;
}

message OutputNoteBatch {
  repeated IndexedOutputNote notes = 1;
}

message BlockBody {
  BlockBodyContents contents = 1;
}

message BlockBodyContents {
  repeated BlockAccountUpdate updated_accounts = 1;
  repeated OutputNoteBatch output_note_batches = 2;
  repeated primitives.Word created_nullifiers = 3;
  repeated transaction.TransactionHeader transactions = 4;
}

message BlockProof {}

message SignedBlock {
  BlockHeader header = 1;
  BlockBody body = 2;
  repeated BlockSignature signatures = 3;
}
