syntax = "proto3";
package transaction;

import "account.proto";
import "block_number.proto";
import "primitives.proto";
import "transaction.proto";
import "transaction_inputs.proto";

message TransactionEffects {
  oneof version {
    TransactionEffectsV1 v1 = 1;
  }
}

// The effects of an executed transaction, without the inputs required to re-execute it.
//
// The transaction ID is recomputed from the other fields on decoding and compared against the
// transmitted one.
message TransactionEffectsV1 {
  TransactionId transaction_id = 1;
  primitives.Word initial_state_commitment = 2;
  primitives.Word final_state_commitment = 3;
  account.AccountPatch account_patch = 4;
  InputNotes input_notes = 5;
  RawOutputNotes output_notes = 6;
  blockchain.BlockNumber ref_block_number = 7;
  primitives.Word ref_block_commitment = 8;
  blockchain.BlockNumber expiration_block_num = 9;
}
