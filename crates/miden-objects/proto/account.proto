syntax = "proto3";
package account;

import "primitives.proto";

message AccountId {
  // Exactly 15 bytes in the protocol's canonical AccountId encoding.
  bytes id = 1;
}

message AccountStorageHeader {
  message StorageSlot {
    string slot_name = 1;
    StorageSlotType slot_type = 2;
    primitives.Word commitment = 3;
  }

  repeated StorageSlot slots = 1;
}

enum StorageSlotType {
  STORAGE_SLOT_TYPE_UNSPECIFIED = 0;
  STORAGE_SLOT_TYPE_VALUE = 1;
  STORAGE_SLOT_TYPE_MAP = 2;
}

enum AccountVersion {
  ACCOUNT_VERSION_UNSPECIFIED = 0;
  ACCOUNT_VERSION_V1 = 1;
}

message AccountHeader {
  AccountVersion version = 1;
  AccountId account_id = 2;
  primitives.Word vault_root = 3;
  primitives.Word storage_commitment = 4;
  primitives.Word code_commitment = 5;
  uint64 nonce = 6;
}

message AccountWitness {
  AccountId witness_id = 1;
  primitives.Word commitment = 2;
  primitives.SparseMerklePath path = 3;
}

message AccountCode {
  primitives.MastForest mast = 1;
  repeated primitives.Word procedure_roots = 2;
}

message StorageSlotId {
  primitives.Felt suffix = 1;
  primitives.Felt prefix = 2;
}

message PartialAccount {
  AccountId account_id = 1;
  primitives.Felt nonce = 2;
  AccountCode code = 3;
  PartialStorage storage = 4;
  PartialVault vault = 5;
  optional primitives.Word seed = 6;
}

message PartialStorage {
  AccountStorageHeader header = 1;
  repeated PartialStorageMap maps = 2;
}

message PartialStorageMap {
  primitives.PartialSmt smt = 1;
  repeated primitives.Word keys = 2;
}

message PartialVault {
  primitives.PartialSmt smt = 1;
  repeated primitives.Word asset_ids = 2;
}

enum StoragePatchOperation {
  STORAGE_PATCH_OPERATION_UNSPECIFIED = 0;
  STORAGE_PATCH_OPERATION_CREATE = 1;
  STORAGE_PATCH_OPERATION_UPDATE = 2;
  STORAGE_PATCH_OPERATION_REMOVE = 3;
}

message StorageValuePatch {
  StoragePatchOperation operation = 1;
  primitives.Word value = 2;
}

message StorageMapEntry {
  primitives.Word key = 1;
  primitives.Word value = 2;
}

message StorageMapPatch {
  StoragePatchOperation operation = 1;
  repeated StorageMapEntry entries = 2;
}

message StorageSlotPatch {
  string slot_name = 1;
  oneof patch {
    StorageValuePatch value = 2;
    StorageMapPatch map = 3;
  }
}

message AccountStoragePatch {
  repeated StorageSlotPatch slots = 1;
}

message AccountVaultPatchEntry {
  primitives.Word asset_id = 1;
  // An empty word removes the asset; any other value must form a valid asset with asset_id.
  primitives.Word value = 2;
}

message AccountVaultPatch {
  repeated AccountVaultPatchEntry entries = 1;
}

enum AccountPatchVersion {
  ACCOUNT_PATCH_VERSION_UNSPECIFIED = 0;
  ACCOUNT_PATCH_VERSION_V1 = 1;
}

message AccountPatch {
  AccountPatchVersion version = 1;
  AccountId account_id = 2;
  AccountStoragePatch storage = 3;
  AccountVaultPatch vault = 4;
  optional AccountCode code = 5;
  optional primitives.Felt final_nonce = 6;
}

message PrivateAccountUpdate {}

message AccountUpdateDetails {
  oneof update {
    PrivateAccountUpdate private = 1;
    AccountPatch public = 2;
  }
}
