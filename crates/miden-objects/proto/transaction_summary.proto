syntax = "proto3";
package transaction;

import "account_state.proto";
import "block_number.proto";
import "primitives.proto";
import "transaction.proto";
import "transaction_inputs.proto";

message TransactionSummary {
  oneof version {
    TransactionSummaryV1 v1 = 1;
  }
}

// The changes of a transaction that are signed to authorize it.
message TransactionSummaryV1 {
  account.AccountDelta account_delta = 1;
  InputNotes input_notes = 2;
  RawOutputNotes output_notes = 3;
  blockchain.BlockNumber block_number = 4;
  primitives.Word block_commitment = 5;
  // Zero if no expiration is set. Must fit in 16 bits.
  uint32 expiration_delta = 6;
  repeated primitives.Felt user_params = 7;
  TransactionLogs logs = 8;
  CodePatch code_patch = 9;
}
