[workspace]
members = ["faucet_extension", "faucet_burn_policy"]

[workspace.package]
version = "0.1.0"

# The xreserve library is linked STATIC so a component package carries the code it exports, and the
# account installing it needs nothing else loaded. Flip this to `dynamic` once the library is
# integrated into `StandardsLib` and loaded into every executor automatically (by
# `TransactionMastStore::new`).
[workspace.dependencies]
xreserve        = { linkage = "static", version = "0.1.0" }
miden-core      = { linkage = "dynamic", version = "0.33" }
miden-protocol  = { linkage = "dynamic", version = "0.17.0" }
miden-standards = { linkage = "dynamic", version = "0.17.0" }
